[project]
name = "plum-dispatch"
description="Multiple dispatch in Python"
authors=[
    {name = "Wessel Bruinsma", email="wessel.p.bruinsma@gmail.com"},
]
license = {text= "MIT"}
readme = "README.md"
keywords = ["multiple dispatch"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dynamic = ["version"]

requires-python = ">=3.10"
dependencies = [
    "beartype>=0.22.2; python_version>='3.14'",
    "beartype>=0.16.2; python_version<'3.14'",
    "typing-extensions>=4.9.0",
    "rich>=10.0"
]

[project.urls]
repository = "https://github.com/beartype/plum"
documentation = "https://beartype.github.io/plum"


[build-system]
requires = ["hatchling>=1.8.0", "hatch-vcs"]
build-backend = "hatchling.build"


[dependency-groups]
dev = [
    { include-group = "docs" },
    { include-group = "lint" },
    { include-group = "nox" },
    { include-group = "test_static" },
    { include-group = "test_runtime" },
]
build = [
    "hatch>=1.15.1",
    "hatch-mypyc>=0.16.0",
    "hatch-vcs",
]
wheels = [
    "build>=1.4.0",
    "cibuildwheel>=2.22.0",
]
docs = [
    "jupyter-book>=1.0.0,<2.0.0",
]
lint = [
    "pre-commit>=4.3.0",
    "pylint>=4.0.4",
]
nox = [
    "nox>=2025.11.12",
    "nox-uv>=0.6.3",
    "uv>=0.9.16",
]
test_static = [
    "mypy>=1.18.2",
    "pyright>=1.1.331",
]
test_runtime = [
    "coveralls>=4.0.1",
    "ipython>=8.18.1",
    "numpy>=2.0.2",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "sybil[pytest]>=9.2.0",
]

[tool.hatch]
build.hooks.vcs.version-file = "src/plum/_version.py"
build.targets.wheel.packages = ["src/plum"]
version.source = "vcs"


[tool.hatch.build.targets.wheel.hooks.mypyc]
enable-by-default = false
dependencies = ["hatch-mypyc>=0.16.0", "mypy>=1.18.2"]
require-runtime-dependencies = true
# TODO: include more files -- but see the note below on which files cannot be included.
#
# A module that *defines* plum-dispatched functions cannot be compiled. Plum builds
# every `Signature` by reading the implementation at runtime with `inspect.signature`,
# and `mypyc` takes both of its inputs away:
#
#   * A compiled module-level function is a `builtin_function_or_method` with no
#     `__annotations__` at all, so every parameter silently degrades to `Any`. A
#     signature declared as `(object, object, object)` resolves as `(Any, Any, Any)`.
#   * Only the *last* of several same-named module-level definitions survives, so the
#     `@dispatch`-a-name-repeatedly pattern loses all but its final method. Compiling
#     `_promotion.py` leaves `promote` with one method instead of three, and
#     `promote(1, 1.0)` raises `NotFoundLookupError`.
#
# Neither is reported as an error at build time; the wheel builds and imports, and the
# damage only shows up when a call fails to resolve. (`tests/test_promotion.py` does
# catch it, so the `Test mypyc wheel` job goes red rather than shipping it.)
#
# That rules out `_promotion.py` and `_parametric.py`. Two further traps apply to any
# module considered for this list:
#
#   * `mypyc` evaluates `TYPE_CHECKING` as statically true, compiles that branch, and
#     replaces the `else` with a trap that raises "Reached allegedly unreachable code!"
#     at import. No module in this list uses `TYPE_CHECKING`; `_promotion.py` does.
#   * A nested function becomes a native callable that `inspect.signature` cannot read
#     at all, which breaks `append_default_args` for anything registered from a closure
#     (as `add_conversion_method` does).
#
# Compiling `_promotion.py` was measured at ~7% on a direct `plum.convert` call and
# nothing at all on the dispatch path, so the payoff does not justify restructuring the
# module around the compiler.
include = [
    "src/plum/_bear.py",
    "src/plum/_dispatcher.py",
    "src/plum/_method.py",
    "src/plum/_overload.py",
    "src/plum/_resolver.py",
    "src/plum/_signature.py",
    "src/plum/_type.py",
]
mypy-args = [
    "--ignore-missing-imports",
    "--disable-error-code=assignment",
    "--disable-error-code=attr-defined",
    "--disable-error-code=return-value",
    "--disable-error-code=arg-type",
    "--disable-error-code=type-var",
    "--disable-error-code=misc",
    "--disable-error-code=valid-type",
    "--disable-error-code=no-redef",
]
options = { debug_level = "0" }

[tool.cibuildwheel]
build-verbosity = 1

# Target environments:
# - Python: CPython 3.10+ only
# - Architecture (64-bit only): amd64 / x86_64, universal2, and arm64
# - OS: Linux (no musl), Windows, and macOS
build = "cp310-* cp311-* cp312-* cp313-*"
skip = [
    "*-manylinux_i686",
    "*-musllinux_*",
    "*-win32",
    "pp*",
]

test-command = 'pytest {project}/tests -k "not incompatible_with_mypyc and not test_cache" --ignore={project}/tests/advanced'
test-requires = [
    "ipython>=8.18.1",
    "numpy>=2.0.2",
    "pytest>=8.4.2",
    "sybil[pytest]>=9.2.0",
]
# Skip testing arm64 builds on Intel Macs
test-skip = ["*-macosx_arm64", "*-macosx_universal2:arm64"]

[tool.cibuildwheel.environment]
HATCH_BUILD_HOOKS_ENABLE = "1"
MYPYC_OPT_LEVEL = "3"
MYPYC_DEBUG_LEVEL = "0"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

# Development tools
[tool.coverage]
run.branch = true
run.command_line = "-m pytest --verbose test"
run.source = ["src/plum"]
run.omit = ["src/plum/_version.py"]
report.exclude_lines = [
    "pragma: no cover",
    "pragma: specific no cover.*${PRAGMA_VERSION}",
    '\.\.\.',
    'if TYPE_CHECKING:',
    'if typing.TYPE_CHECKING:',
]


[tool.mypy]
disable_error_code = ["no-redef"]
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files = ["src/plum"]
strict = true
follow_imports = "skip"  # TODO: Set to "normal" when mypy errors are fixed
show_error_codes = true
exclude = [  # TODO: Fix the mypy errors in all these files
    "src/plum/_parametric\\.py",
    "src/plum/_promotion\\.py",
]

[[tool.mypy.overrides]]
module = ["beartype.*", "rich.*"]
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = ["tests/", "src/plum", "docs"]
addopts = [
    "-ra",
    "-p",
    "no:doctest",
]
minversion = "6.0"
markers = [
    "incompatible_with_mypyc: marks tests as incompatible with mypyc-compiled code",
]


[tool.ruff]
src = ["src/plum"]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "B",  # flake8-bugbear
    "D410",
    "E", "W",  # pycodestyle
    "F",  # Pyflakes
    "I",  # isort
    "SIM",  # flake8-simplify
    "UP",  # pyupgrade
]
ignore = ["F811", "B018", "UP038"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["beartype"]
known-local-folder = ["plum"]
extra-standard-library = ["typing_extensions"]

[tool.ruff.format]
docstring-code-format = true
