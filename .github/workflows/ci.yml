name: CI

on:
  workflow_dispatch:

  pull_request:

  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        value:
          - name: "3.10"
            python-version: "3.10"
          - name: "3.11"
            python-version: "3.11"
          - name: "3.12"
            python-version: "3.12"
          - name: "3.13"
            python-version: "3.13"
          - name: "3.13-pre-beartype"
            python-version: "3.13"
            pre-beartype: true
          - name: "3.14"
            python-version: "3.14"
          - name: "3.14-pre-beartype"
            python-version: "3.14"
            pre-beartype: true

    name: Test ${{ matrix.value.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.value.python-version }}
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ matrix.value.python-version }}
      - name: Install dependencies
        run: uv sync --group dev --locked
      # `uv run` and `nox`'s `uv sync` both reset the environment to `uv.lock`, so every
      # `uv run` below uses `--no-sync`, and the pre-release beartype is installed into
      # `nox`'s own venv as well, which `-R` below then reuses without syncing it again.
      - name: Install pre-release beartype
        if: ${{ matrix.value.pre-beartype }}
        run: |
          uv pip install --upgrade --pre beartype
          uv run --no-sync nox -s typecheck --install-only
          uv pip install --python .nox/typecheck/bin/python --upgrade --pre beartype
      - name: Test linter assertions
        run: uv run --no-sync nox -R -s typecheck
      - name: Show beartype version
        run: uv run --no-sync python -c "import beartype; print('beartype', beartype.__version__)"
      - name: Run tests
        run: |
          PRAGMA_VERSION=`uv run --no-sync python -c "import sys; print('.'.join(map(str, sys.version_info[:2])))"` \
          uv run --no-sync pytest -v --cov=src/plum --cov-report term-missing --cov-report lcov:coverage.lcov
      - name: Coveralls parallel
        uses: coverallsapp/github-action@v2
        with:
          flag-name: run-${{ matrix.value.name }}
          parallel: true
          file: coverage.lcov

  # Test that `mypyc`-compiled wheels work.
  test-mypyc:
    name: Test mypyc wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@681c641aba71e4a1c380be3ab5e12ad51f415867 # v7.1.6
        with:
          python-version: "3.12"

      - name: Install build & test dependencies
        run: uv sync --locked --no-install-project --no-default-groups --group build --group wheels --group test_static --group test_runtime

      - name: Build mypyc wheel
        run: uv run --no-sync python -m build --wheel
        env:
          HATCH_BUILD_HOOKS_ENABLE: "1"

      - name: Install wheel
        run: uv pip install dist/*.whl

      - name: Verify compiled
        run: uv run --no-sync python -c "from plum import COMPILED; print(f'COMPILED={COMPILED}'); assert COMPILED"

      - name: Run tests
        run: uv run --no-sync pytest tests/ -v -k "not incompatible_with_mypyc" --ignore=tests/advanced

  finish:
    name: Finish coverage
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls finished
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
